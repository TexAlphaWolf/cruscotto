# Gradle daemon: 4 GB heap and the Parallel GC, which suits short build bursts better than the
# default G1 (this is what Android Studio's Build Analyzer recommends).
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
